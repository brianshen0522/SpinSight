server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── HLS segments ────────────────────────────────────────────────────────────
    location /hls/ {
        alias /hls/;
        types {
            application/vnd.apple.mpegurl  m3u8;
            video/mp2t                     ts;
        }
        add_header Cache-Control  "no-cache, no-store, must-revalidate";
        add_header Pragma         "no-cache";
        add_header Expires        "0";
        add_header Access-Control-Allow-Origin  "*";
        add_header Access-Control-Allow-Headers "*";
    }

    # ── Stream health probe (frontend polls this) ────────────────────────────────
    # Returns 200 when the manifest exists, 503 when transcoder hasn't started yet.
    location = /stream-health {
        access_log off;
        default_type application/json;
        if (-f /hls/stream.m3u8) {
            return 200 '{"status":"live"}';
        }
        return 503 '{"status":"offline"}';
    }

    # ── Frontend SPA ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Generic health ───────────────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
