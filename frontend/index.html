<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roulette Stream Viewer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- ── Header ──────────────────────────────────────────────────────────── -->
    <header>
      <span class="title">Roulette Stream</span>
      <div class="mode-switch" role="tablist" aria-label="View mode">
        <button id="mode-debug" class="mode-btn is-active" type="button" data-mode="debug">Debug</button>
        <button id="mode-settings" class="mode-btn" type="button" data-mode="settings">Settings</button>
        <button id="mode-dataset" class="mode-btn" type="button" data-mode="dataset">Dataset</button>
      </div>
      <div class="status-bar">
        <div id="status-dot" class="dot waiting"></div>
        <button id="stream-refresh" class="stream-refresh" type="button" aria-label="Refresh stream" title="Refresh stream">
          ↻
        </button>
        <span id="status-label">Waiting for stream</span>
        <span id="reconnect-attempt"></span>
        <span id="uptime"></span>
      </div>
      <div id="freeze-badge" class="freeze-badge hidden">⏸ FROZEN</div>
    </header>

    <!-- Hidden video element for HLS playback -->
    <video id="stream-video" playsinline muted autoplay style="display:none"></video>

    <!-- ── 2×2 Canvas Grid ────────────────────────────────────────────────── -->
    <div class="quad-grid" id="quad-grid">

      <div class="quad-pane pane-orig" data-view="orig">
        <canvas id="q-orig"></canvas>
        <div class="quad-label">Original</div>
        <div id="viewer-hint" class="viewer-hint hidden"></div>
      </div>

      <aside class="block-list-panel" id="block-list-panel">
        <div class="block-list-header">
          <span class="block-list-title">Detected Blocks</span>
          <span class="block-list-meta" id="block-list-meta">0 items</span>
        </div>
        <div class="block-list" id="block-list"></div>
        <div id="prediction-panel" class="prediction-panel">
          <div class="prediction-header">
            <span class="prediction-title">Wheel Prediction</span>
            <span id="prediction-meta" class="prediction-meta"></span>
          </div>
          <div id="prediction-content" class="prediction-content"></div>
        </div>
      </aside>

      <aside class="settings-panel hidden" id="settings-panel"></aside>

      <div class="quad-pane pane-red" data-view="red">
        <canvas id="q-red"></canvas>
        <div class="quad-label" id="label-red">Red</div>
      </div>

      <div class="quad-pane pane-green" data-view="green">
        <canvas id="q-green"></canvas>
        <div class="quad-label" id="label-green">Green</div>
      </div>

      <div class="quad-pane pane-black" data-view="black">
        <canvas id="q-black"></canvas>
        <div class="quad-label" id="label-black">Black</div>
      </div>

      <section class="dataset-panel hidden" id="dataset-panel"></section>

      <button class="focus-exit" id="focus-exit" type="button" aria-label="Back to grid">
        Back to grid
      </button>

      <!-- Overlay shown while stream isn't ready -->
      <div class="grid-overlay" id="video-overlay">
        <div class="overlay-icon">📡</div>
        <div class="overlay-text" id="overlay-text">Waiting for transcoder…</div>
      </div>

    </div>

    <!-- ── Footer ──────────────────────────────────────────────────────────── -->
    <footer>
      <span>HLS: <code>/hls/stream.m3u8</code></span>
      <span id="footer-time"></span>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
